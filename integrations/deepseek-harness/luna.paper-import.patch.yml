# Optional overlay for a Luna paper-import experiment. Apply after the normal
# math-map profile with:
#   dsh --profile math-map --patch ./integrations/deepseek-harness/luna.paper-import.patch.yml
#
# This changes only the paper-import experiment identity and its four stage
# routes. Prompts, chunking, concurrency, validation, and repair remain shared
# with the DeepSeek workflow. This overlay is the high-generous Luna condition.
- id: cmath-paper-import-router
  config:
    extract: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: high, maxTokens: 64000 }
    guide: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: high, maxTokens: 64000 }
    aggregate: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: high, maxTokens: 64000 }
    integrate: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: high, maxTokens: 64000 }
    assemble: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: high, maxTokens: 64000 }
    repair: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: high, maxTokens: 64000 }

- id: cmath-paper-import
  config:
    experimentId: luna-paper-import-hopf-v1
    condition: high-generous
    tokenBudget: { integrate: 16000, normal: 32000, retry: 64000 }
