# Luna off-compact paper-import workflow v2 experiment. Apply after the normal
# Math Map bundle patch. This preserves v1 and selects the v2 prompt/chunk policy
# only for this experiment.
- id: cmath-paper-import-router
  config:
    extract: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: off, maxTokens: 32000 }
    guide: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: off, maxTokens: 32000 }
    aggregate: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: off, maxTokens: 32000 }
    integrate: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: off, maxTokens: 32000 }
    assemble: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: off, maxTokens: 32000 }
    repair: { provider: luna-gateway, model: gpt-5.6-luna, reasoningEffort: off, maxTokens: 32000 }
- id: cmath-paper-import
  config:
    experimentId: luna-paper-import-off-compact-workflow-v2
    condition: off-compact
    workflowVersion: v2
    concurrency: 4
    tokenBudget: { aggregate: 8000, integrate: 8000, normal: 16000, retry: 32000 }
