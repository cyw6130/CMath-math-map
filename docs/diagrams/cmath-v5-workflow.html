<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMath 数学地图｜V5.1 工作流</title>
  <style>
    :root {
      --paper: #f4f1e8;
      --paper-raised: #fbfaf4;
      --paper-sunken: #ede9dc;
      --ink: #1b1a15;
      --ink-soft: #4b483e;
      --line: #ddd7c6;
      --line-strong: #c2bba6;
      --teal: #0e7c66;
      --teal-deep: #0a5c4c;
      --teal-soft: #e5f0eb;
      --rose: #c2486b;
      --rose-soft: #f5e3e8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); }
    body {
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    svg { display: block; width: min(1280px, 100vw); height: auto; }
    .node { fill: var(--paper-raised); stroke: var(--line-strong); stroke-width: 2; }
    .decision { fill: var(--paper-raised); stroke: var(--teal); stroke-width: 2; }
    .success { fill: var(--teal-soft); stroke: var(--teal); stroke-width: 2; }
    .failure { fill: var(--rose-soft); stroke: var(--rose); stroke-width: 2; }
    .edge { fill: none; stroke: var(--ink-soft); stroke-width: 2; marker-end: url(#flow-arrow); }
    .merge { fill: none; stroke: var(--ink-soft); stroke-width: 2; }
    .happy { fill: none; stroke: var(--teal); stroke-width: 3; marker-end: url(#flow-arrow-teal); }
    .error { fill: none; stroke: var(--rose); stroke-width: 2; marker-end: url(#flow-arrow-rose); }
    .eyebrow { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 1.6px; fill: var(--teal-deep); }
    .title { font: 800 32px Nunito, "Helvetica Neue", Arial, "PingFang SC", sans-serif; fill: var(--ink); }
    .subtitle { font-size: 14px; fill: var(--ink-soft); }
    .node-title { font: 750 16px Nunito, "Helvetica Neue", Arial, "PingFang SC", sans-serif; fill: var(--ink); }
    .node-copy { font-size: 12px; fill: var(--ink-soft); }
    .mono { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--teal-deep); }
    .branch-bg { fill: var(--paper); }
    .branch { font: 800 12px ui-monospace, "SF Mono", Menlo, monospace; }
    .legend { font-size: 12px; fill: var(--ink-soft); }
  </style>
</head>
<body>
  <svg viewBox="0 0 1280 720" role="img" aria-labelledby="flow-title flow-desc">
    <title id="flow-title">CMath V5.1 论文导入工作流</title>
    <desc id="flow-desc">PDF 经 MinerU 转为标记文本，V5.1 生成候选地图并验证能力合同。通过后形成 Paper-to-Map Result 并保存到 Map Library；失败时在最多两次修复额度内循环，耗尽后显式失败并保留安全状态。</desc>
    <defs>
      <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#4b483e"/></marker>
      <marker id="flow-arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#0e7c66"/></marker>
      <marker id="flow-arrow-rose" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#c2486b"/></marker>
      <filter id="flow-paper" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="23" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
        <feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
      </filter>
    </defs>

    <rect width="1280" height="720" fill="#f4f1e8"/>
    <rect width="1280" height="720" filter="url(#flow-paper)" opacity="0.5"/>
    <text class="eyebrow" x="40" y="36">CMATH · PRODUCTION DEFAULT</text>
    <text class="title" x="40" y="76">论文导入 V5.1 工作流</text>
    <text class="subtitle" x="40" y="104">当前默认路径：生成、合同校验、有界修复、结果交接</text>
    <rect x="40" y="120" width="1200" height="2" fill="#0e7c66"/>

    <!-- Connectors are drawn before nodes. -->
    <path class="edge" d="M200 272H236"/>
    <path class="edge" d="M412 272H448"/>
    <path class="edge" d="M632 272H648"/>
    <path class="happy" d="M824 272H856"/>
    <path class="happy" d="M1032 272H1064"/>
    <path class="error" d="M736 324V380"/>
    <path class="edge" d="M648 430H584"/>
    <path class="merge" d="M584 430H640V272"/>
    <path class="error" d="M824 430H856"/>

    <rect class="node" x="56" y="240" width="144" height="64" rx="8"/>
    <text class="mono" x="128" y="268" text-anchor="middle">INPUT</text>
    <text class="node-title" x="128" y="292" text-anchor="middle">PDF 论文</text>

    <rect class="node" x="236" y="224" width="176" height="96" rx="8"/>
    <text class="mono" x="260" y="252">01 · MINERU</text>
    <text class="node-title" x="260" y="280">提取标记文本</text>
    <text class="node-copy" x="260" y="304">保留结构与公式</text>

    <rect class="node" x="448" y="224" width="184" height="96" rx="8"/>
    <text class="mono" x="472" y="252">02 · GENERATE</text>
    <text class="node-title" x="472" y="280">V5.1 生成</text>
    <text class="node-copy" x="472" y="304">候选数学地图</text>

    <polygon class="decision" points="736,220 824,272 736,324 648,272"/>
    <text class="mono" x="736" y="260" text-anchor="middle">03 · VALIDATE</text>
    <text class="node-title" x="736" y="284" text-anchor="middle">合同通过？</text>

    <rect class="success" x="856" y="224" width="176" height="96" rx="8"/>
    <text class="mono" x="880" y="252">04 · HANDOFF</text>
    <text class="node-title" x="880" y="280">Paper-to-Map</text>
    <text class="node-copy" x="880" y="304">稳定 Result</text>

    <rect class="success" x="1064" y="224" width="160" height="96" rx="8"/>
    <text class="mono" x="1088" y="252">DONE</text>
    <text class="node-title" x="1088" y="280">保存地图库</text>
    <text class="node-copy" x="1088" y="304">交给产品打开</text>

    <polygon class="decision" points="736,380 824,430 736,480 648,430"/>
    <text class="node-title" x="736" y="420" text-anchor="middle">仍有修复额度？</text>
    <text class="node-copy" x="736" y="444" text-anchor="middle">最多 2 次</text>

    <rect class="node" x="408" y="388" width="176" height="84" rx="8"/>
    <text class="mono" x="432" y="416">REPAIR</text>
    <text class="node-title" x="432" y="444">修复候选结果</text>
    <text class="node-copy" x="432" y="464">随后重新校验</text>

    <rect class="failure" x="856" y="388" width="224" height="84" rx="8"/>
    <text class="mono" x="880" y="416" fill="#9b3151">STOP</text>
    <text class="node-title" x="880" y="444">显式失败</text>
    <text class="node-copy" x="880" y="464">保留安全状态，不写入半成品</text>

    <rect class="branch-bg" x="828" y="260" width="24" height="24" rx="4"/>
    <text class="branch" x="840" y="276" text-anchor="middle" fill="#0a5c4c">是</text>
    <rect class="branch-bg" x="724" y="336" width="24" height="24" rx="4"/>
    <text class="branch" x="736" y="352" text-anchor="middle" fill="#9b3151">否</text>
    <rect class="branch-bg" x="612" y="418" width="24" height="24" rx="4"/>
    <text class="branch" x="624" y="434" text-anchor="middle" fill="#0a5c4c">是</text>
    <rect class="branch-bg" x="828" y="418" width="24" height="24" rx="4"/>
    <text class="branch" x="840" y="434" text-anchor="middle" fill="#9b3151">否</text>

    <rect x="56" y="536" width="1168" height="64" rx="8" fill="#ede9dc" stroke="#ddd7c6" stroke-width="2"/>
    <text class="mono" x="80" y="564">INVARIANT</text>
    <text class="node-copy" x="80" y="588">只有通过能力合同校验的 Project View 才能进入 Map Library；Benchmark 不在这条生产路径中运行。</text>

    <line x1="40" y1="636" x2="1240" y2="636" stroke="#c2bba6" stroke-width="2"/>
    <line x1="56" y1="672" x2="104" y2="672" stroke="#0e7c66" stroke-width="3"/>
    <path d="M100 668L108 672L100 676Z" fill="#0e7c66"/>
    <text class="legend" x="120" y="676">成功路径</text>
    <line x1="248" y1="672" x2="296" y2="672" stroke="#c2486b" stroke-width="2"/>
    <path d="M292 668L300 672L292 676Z" fill="#c2486b"/>
    <text class="legend" x="312" y="676">失败 / 额度耗尽</text>
    <text class="legend" x="1240" y="676" text-anchor="end">当前态：V5.1，不混入历史 V4.1</text>
  </svg>
</body>
</html>
